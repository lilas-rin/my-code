services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/usr/src/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /usr/src/app/app
    environment:
      - DATABASE_DRIVER=postgresql
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=fastapi
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=123
      - JWT_SECRET_KEY=jakbduiwanjhodihawdwadwad54d98awf49w8a4f98wf84wa98f49a8wf49a8wf4wa98f4
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: fastapi
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastapi"]
      interval: 5s
      timeout: 5s
      retries: 5
